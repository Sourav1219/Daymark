name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Shared credentials for jobs that boot the application runtime or run
  # database-backed suites. Values are throwaway test-only configuration.
  BETTER_AUTH_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
  BETTER_AUTH_URL: http://127.0.0.1:3000
  DATABASE_URL: postgresql://traketo:traketo@127.0.0.1:5432/traketo_test
  MIGRATION_DATABASE_URL: postgresql://traketo:traketo@127.0.0.1:5432/traketo_test
  TEST_DATABASE_URL: postgresql://traketo:traketo@127.0.0.1:5432/traketo_test
  CRON_SECRET: ci-cron-secret-0123456789abcdef0123456789abcdef

jobs:
  check:
    name: Static checks, unit tests, build
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Without TEST_DATABASE_URL the database-backed integration suites skip;
      # they run in the dedicated integration job below.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Keep the checked-in production audit inside the agreed quality budget.
      # Refresh lighthouse-current.json whenever the deployed site is audited.
      - run: pnpm performance:check
      - run: pnpm build
        env:
          E2E_TEST_MODE: "true"
          MIGRATION_DATABASE_URL: postgresql://traketo_migrator:traketo@127.0.0.1:5432/traketo_test
          NEXT_PUBLIC_E2E_TEST_MODE: "true"

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: traketo
          POSTGRES_PASSWORD: traketo
          POSTGRES_DB: traketo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traketo -d traketo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Apply every reviewed migration so suites exercise the real schema,
      # including tenant predicates that unit tests cannot cover.
      - run: pnpm db:migrate
      - run: pnpm db:check
      # TEST_DATABASE_URL enables the previously skipped integration suites,
      # including tenant-isolation coverage.
      - run: pnpm test

  migration-drift:
    name: Migration drift detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Generating must produce zero diff against the committed SQL and
      # snapshots; any output means schema and migrations have diverged.
      - run: pnpm db:generate
      - run: git diff --exit-code -- drizzle

  backup-restore:
    name: Backup and restore verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: traketo
          POSTGRES_PASSWORD: traketo
          POSTGRES_DB: traketo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traketo -d traketo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # The restore drill needs client binaries matching the server version.
      # Ubuntu's default repository can lag PostgreSQL, so enable the official
      # PGDG repository before requesting the versioned client package.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pnpm db:migrate
      - name: Dump, wipe, restore, verify
        run: ./scripts/backup-restore-check.sh
        env:
          DATABASE_URL: postgresql://traketo:traketo@127.0.0.1:5432/traketo_test

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: traketo
          POSTGRES_PASSWORD: traketo
          POSTGRES_DB: traketo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traketo -d traketo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_TEST_MODE: "true"
          NEXT_PUBLIC_E2E_TEST_MODE: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  pwa-e2e:
    name: Production PWA tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: traketo
          POSTGRES_PASSWORD: traketo
          POSTGRES_DB: traketo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traketo -d traketo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pwa
        env:
          E2E_TEST_MODE: "true"
          MIGRATION_DATABASE_URL: postgresql://traketo_migrator:traketo@127.0.0.1:5432/traketo_test
          NEXT_PUBLIC_E2E_TEST_MODE: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-pwa-report
          path: test-results/
          retention-days: 7

  security:
    name: Dependency audit and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Mandatory gate: fails the build on known advisories in production
      # dependencies at high severity or above.
      - run: pnpm audit --prod --audit-level=high
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Deployment smoke checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, integration]
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      SMOKE_READINESS_SECRET: ${{ secrets.SMOKE_READINESS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.4.0
        with:
          node-version: 26
      # Runs against the production preview URL once configured; skipped
      # until SMOKE_BASE_URL is provided as a repository secret.
      - run: pnpm smoke
        env:
          BASE_URL: ${{ env.SMOKE_BASE_URL }}
          READINESS_SECRET: ${{ env.SMOKE_READINESS_SECRET }}
        if: env.SMOKE_BASE_URL != ''
